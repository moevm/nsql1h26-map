services:
  db:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:10001:11111"
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PYTHONUNBUFFERED: "1"
      DEV_MODE: ${DEV_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11111/docs')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data: