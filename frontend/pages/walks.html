<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityTrace - Прогулки</title>
    <link rel="stylesheet" href="/src/css/walksPage/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      .map-container {
        padding: 0 var(--block-padding);
        margin-bottom: 20px;
      }
      
      #walks-map {
        width: 100%;
        height: 400px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      
      .leaflet-control-attribution {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <img class="header__image" src="/src/svg/logo.svg" alt="CityTrace logo">
        <span class="header__logo-text">CityTrace</span>
      </div>
      <nav class="header__navigation">
        <ul class="header__menu">
          <li class="header__menu-item">
            <a class="header__link" href="/pages/map.html">Карта</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/routes.html">Маршруты</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link header__link--active" href="/pages/walks.html">Прогулки</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/points.html">Точки карты</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/profile.html">Профиль</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="walks-main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">Прогулки</h1>
          <span class="page-header__count">0 прогулок</span>
        </div>
        <div class="page-header__right">
          <button class="btn btn--secondary" id="import-walks-btn">
            <img src="/src/svg/routes/import.svg" alt="" class="btn__icon">
            <span>Импорт прогулок</span>
          </button>
          <button class="btn btn--primary" id="new-walk-btn">
            <img src="/src/svg/routes/plus.svg" alt="" class="btn__icon">
            <span>Новая прогулка</span>
          </button>
        </div>
      </div>

        <div class="filter-bar">
        <div class="filter-bar__item filter-bar__item--date">
          <label class="filter-bar__label">Дата</label>
          <div class="filter-bar__control">
            <input type="date" class="filter-bar__date-input" id="date-from" placeholder="дд.мм.гггг">
            <span class="filter-bar__date-separator">—</span>
            <input type="date" class="filter-bar__date-input" id="date-to" placeholder="дд.мм.гггг">
          </div>
        </div>

        <div class="filter-bar__item">
          <label class="filter-bar__label">Расстояние</label>
          <select class="filter-bar__select" id="distance-filter">
            <option value="any">Любое</option>
            <option value="0-5">до 5 км</option>
            <option value="5-10">5-10 км</option>
            <option value="10-15">10-15 км</option>
            <option value="15+">более 15 км</option>
          </select>
        </div>

        <div class="filter-bar__item">
          <label class="filter-bar__label">Длительность</label>
          <select class="filter-bar__select" id="duration-filter">
            <option value="any">Любая</option>
            <option value="0-30">до 30 мин</option>
            <option value="30-60">30-60 мин</option>
            <option value="60-120">1-2 часа</option>
            <option value="120+">более 2 часов</option>
          </select>
        </div>

        <div class="filter-bar__actions">
          <button class="btn-reset" id="reset-filters-btn">Сброс фильтров</button>
          <button class="btn-export" id="export-selected-btn">
            <img src="/src/svg/routes/export.svg" alt="" class="btn-export__icon">
            <span>Экспорт выбранных</span>
          </button>
        </div>
      </div>

      <div class="table-container">
        <table class="walks-table">
          <thead>
            <tr>
              <th class="walks-table__th walks-table__th--checkbox">
                <input type="checkbox" id="select-all-checkbox">
              </th>
              <th class="walks-table__th">#</th>
              <th class="walks-table__th">Имя прогулки / ID</th>
              <th class="walks-table__th">Дата и время</th>
              <th class="walks-table__th">Расстояние (км)</th>
              <th class="walks-table__th">Длительность</th>
              <th class="walks-table__th">Новые тайлы</th>
              <th class="walks-table__th">Действия</th>
            </tr>
          </thead>
          <tbody id="walks-table-body">
          </tbody>
        </table>

        <div class="pagination">
          <div class="pagination__info">
            <div class="pagination__per-page">
              <span>Записей на экране</span>
              <select class="pagination__select" id="per-page-select">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">25</option>
                <option value="50">50</option>
              </select>
            </div>
            <span class="pagination__range" id="pagination-range">Показано 1-5 из 142 прогулок</span>
          </div>
          <div class="pagination__controls">
            <button class="pagination__btn pagination__btn--prev" id="prev-page-btn">
              <img src="/src/svg/routes/arrow-left.svg" alt="">
            </button>
            <button class="pagination__btn pagination__btn--page pagination__btn--active" data-page="1">1</button>
            <button class="pagination__btn pagination__btn--page" data-page="2">2</button>
            <button class="pagination__btn pagination__btn--page" data-page="3">3</button>
            <span class="pagination__dots">...</span>
            <button class="pagination__btn pagination__btn--page" data-page="12">12</button>
            <button class="pagination__btn pagination__btn--next" id="next-page-btn">
              <img src="/src/svg/routes/arrow-right.svg" alt="">
            </button>
          </div>
        </div>
      </div>

      <div class="map-container">
        <div id="walks-map"></div>
      </div>

      <div class="dashboard">
        <div class="dashboard__card dashboard__card--dist">
          <div class="dashboard__card-header">
            <span class="dashboard__card-title">Общее расстояние</span>
            <img src="/src/svg/routes/dashboard-distance.svg" alt="" class="dashboard__card-icon">
          </div>
          <div class="dashboard__card-value">
            <span class="dashboard__card-number">1,842.5</span>
            <span class="dashboard__card-unit">км</span>
          </div>
        </div>
        <div class="dashboard__card dashboard__card--time">
          <div class="dashboard__card-header">
            <span class="dashboard__card-title">Среднее время / прогулка</span>
            <img src="/src/svg/routes/dashboard-time.svg" alt="" class="dashboard__card-icon">
          </div>
          <div class="dashboard__card-value">
            <span class="dashboard__card-number">42мин 15с</span>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/js/pages/walksPage.js"></script>
  </body>
</html>
