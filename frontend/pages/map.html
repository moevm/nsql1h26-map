<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityTrace</title>

    <link rel="stylesheet" href="/src/css/mapPage/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <img
          class="header__image"
          src="/src/svg/logo.svg"
          alt="CityTrace logo"
        />
        <span class="header__logo-text">CityTrace</span>
      </div>
      <nav class="header__navigation">
        <ul class="header__menu">
          <li class="header__menu-item">
            <a class="header__link header__link--active" href="/pages/map.html"
              >Карта</a
            >
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/routes.html">Маршруты</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/walks.html">Прогулки</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/points.html">Точки карты</a>
          </li>
          <li class="header__menu-item">
            <a class="header__link" href="/pages/profile.html">Профиль</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="map-layout">
      <aside class="sidebar">

          <div class="route-card__header">

        <div class="map-layers">
          <p class="map-layers__title">Слои карты</p>
          <div class="map-layers__grid">
            <button class="map-layer-chip" data-layer="bar">
              <span class="map-layer-chip__icon">🍸</span>
              <span>Бары</span>
            </button>
            <button class="map-layer-chip" data-layer="cafe">
              <span class="map-layer-chip__icon">☕</span>
              <span>Кафе</span>
            </button>
            <button class="map-layer-chip" data-layer="restaurant">
              <span class="map-layer-chip__icon">🍽️</span>
              <span>Рестораны</span>
            </button>
            <button class="map-layer-chip" data-layer="hotel">
              <span class="map-layer-chip__icon">🏨</span>
              <span>Отели</span>
            </button>
            <button class="map-layer-chip" data-layer="fast_food">
              <span class="map-layer-chip__icon">🍔</span>
              <span>Фастфуд</span>
            </button>
            <button class="map-layer-chip" data-layer="library">
              <span class="map-layer-chip__icon">📚</span>
              <span>Библиотеки</span>
            </button>
            <button class="map-layer-chip" data-layer="pub">
              <span class="map-layer-chip__icon">🍺</span>
              <span>Пабы</span>
            </button>
            <button class="map-layer-chip" data-layer="bakery">
              <span class="map-layer-chip__icon">🥐</span>
              <span>Пекарни</span>
            </button>
            <button class="map-layer-chip" data-layer="memorial">
              <span class="map-layer-chip__icon">🗿</span>
              <span>Памятники</span>
            </button>
            <button class="map-layer-chip" data-layer="museum">
              <span class="map-layer-chip__icon">🏛️</span>
              <span>Музеи</span>
            </button>
          </div>
        </div>

        <div class="map-layers">
          <p class="map-layers__title">Покрытые тайлы</p>
          <div class="map-layers__grid">
            <input
              class="map-layer__switch-input"
              type="checkbox"
              name="switch"
              id="switch"
            />
            <label class="map-layer__switch-label" for="switch"></label>
          </div>
        </div>

        <button class="sidebar__build-btn" id="build-route-btn">
          <svg
            class="sidebar__build-btn-icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
          >
            <path
              d="M9 1.5v15M1.5 9h15"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <path
              d="M4 4l1.5 1.5M12.5 12.5L14 14M14 4l-1.5 1.5M5.5 12.5L4 14"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span>Построить оптимальный маршрут</span>
        </button>
      </aside>

      <main class="map-area" id="map-container">
        <div class="map-area__canvas">
          <div class="map-area__map" id="map">
          </div>
        </div>
        <div class="map-bottom-bar">
          <button class="bottom-bar-btn bottom-bar-btn--import" id="import-btn">
            <svg
              class="bottom-bar-btn__icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
            >
              <path
                d="M8 2v9M4.5 7.5L8 11l3.5-3.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M2 13h12"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Импорт дампа базы данных</span>
          </button>
          <button class="bottom-bar-btn bottom-bar-btn--export" id="export-btn">
            <svg
              class="bottom-bar-btn__icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
            >
              <path
                d="M8 10V1M4.5 4.5L8 1l3.5 3.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M2 13h12"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Экспорт дампа базы данных</span>
          </button>
        </div>
      </main>
    </div>

    <div class="modal-overlay"></div>
    <div class="modal">
      <div class="modal__header">
        <div class="modal__title-data">
          <h1 class="modal__title">Построение оптимального маршрута</h1>
          <h3 class="modal__sub-title">Шаг 1</h3>
        </div>
        <button class="modal-close">
          <img src="/src/svg/close-icon.svg" alt="close-btn" />
        </button>
      </div>
      <div class="modal__content">
        <section class="distance-control">
          <div class="modal__tabs">
            <h2 class="modal__tabs-title">Продолжительность маршрута</h2>
          </div>
          <div class="distance-control__input-group">
            <button class="distance-control__button">−</button>
            <div class="distance-control__value">5.0 км</div>
            <button class="distance-control__button">+</button>
          </div>

          <input
            type="range"
            class="distance-control__slider"
            min="1"
            max="20"
            value="5"
            step="0.5"
          />

          <div class="distance-control__range">
            <span class="distance-control__limit">1км</span>
            <span class="distance-control__limit">20км</span>
          </div>
        </section>

        <section class="priority-control">
          <div class="priority-control__input-group">
            <button class="priority-control__button">−</button>
            <div class="priority-control__value">Приоритет маршрута</div>
            <button class="priority-control__button">+</button>
          </div>
          <input
            type="range"
            class="priority-control__slider"
            min="0"
            max="1"
            value="0.5"
            step="0.1"
          />

          <div class="priority-control__range">
            <span class="priority-control__limit">Новые тайлы</span>
            <span class="priority-control__limit">Интересные места</span>
          </div>
        </section>

        <div class="button-group">
          <button class="modal__button modal__button--secondary">Отмена</button>
          <button class="modal__button modal__button--build modal__button--primary">
            Построить маршрут
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/pages/mapPage.js"></script>
  </body>
</html>
